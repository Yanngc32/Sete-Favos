[project]
name = "casa"
version = "0.1.0"
description = "Integrador da casa: controle local de Tuya/Positivo, Midea, LG webOS e Xiaomi"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "pydantic>=2.8",
    "keyring>=25",
    "httpx>=0.27",
    "tinytuya>=1.17",
    "msmart-ng>=2025.1",
    "aiowebostv>=0.7,<0.11",  # lg.py sobrescreve _check_registration
    "python-miio==0.5.12",
    "netifaces-plus>=0.12",
]

[project.scripts]
casa = "casa.__main__:main"
casa-diag = "casa.diag:main"
casa-demo = "casa.demo:main"

[dependency-groups]
build = [
    "pyinstaller>=6.10",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# python-miio 0.5.12 depende de netifaces, que não tem wheel pra Windows/3.13.
# netifaces-plus é um fork com wheels que expõe o mesmo módulo `netifaces`.
override-dependencies = ['netifaces ; sys_platform == "never"']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S311", "B008", "B027", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017", "ASYNC110", "E501"]
